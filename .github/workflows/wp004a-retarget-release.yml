          TREE = 'b0fffa10ab989a03ab54ce01c9d10d6e83e393a7'
          PREVIOUS = '7d66b8bb26de1f65d444de224b8068dab964d54d'
          PREVIOUS_TREE = '492d35b901c61a44c078915d59e0f95cdfa89c7e'
          PREVIOUS_BLOB = 'a5a86ee30b223892e2c79f6b46f939495706aa72'
          BRANCH = 'wp/WP-004a-retarget-2e068c4'
          BRANCH_PATH = '/branches/wp%2FWP-004a-retarget-2e068c4'
          WORKFLOW = '.github/workflows/wp004a-retarget-release.yml'
          OPERATION = 'wp004a-repair-tag-387547778-01'
          RELEASE = 387547778
          RELEASE_PATH = '/releases/' + str(RELEASE)
          ASSETS_PATH = RELEASE_PATH + '/assets?per_page=100'
          TAG_BEFORE = 'untagged-b3f7146405b5c9f50ebf'
          TAG_AFTER = 'wp004a-evidence-7f2a966'
          NAME_SHA = '05aed9c29d63a3cf0e84dffdd56eeadd78333ab3f4f57f28c9eb3c5ac986659f'
          BODY_SHA = '867e8f4b25f34c5d186ff8b71ca417cb424e857acb03a0a952c3eff5ccb7f0c2'
          BASELINE_HISTORY = '24aa060502cff0c10a2d5f689c29b536704d7f18043df27d5539640bccd72b28'
          HISTORY_FIELDS = ('id', 'path', 'event', 'head_sha', 'run_attempt', 'status', 'conclusion')
          PATCH_BODY = {'tag_name': TAG_AFTER, 'target_commitish': SOURCE,
