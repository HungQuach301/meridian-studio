                        'phase': 'context' if api is None else api.phase,
                        'patchAttempted': api is not None and api.patch_attempts > 0,
                        'error': code, 'retryAllowed': False, 'benchmarkExecuted': False})
                  return 1
          
          if __name__ == '__main__':
              sys.exit(main(sys.argv[1:]))
