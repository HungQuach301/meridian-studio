                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  require(live_open.call_count == 0, 'LIVE_OPENER_ATTEMPTED_IN_TEST')
              require(before == (NAME_SHA, BODY_SHA, BASELINE_HISTORY, canonical(PATCH_BODY)),
                      'SELF_TEST_CONSTANTS_NOT_RESTORED')
              require(result.wasSuccessful(), 'OFFLINE_REGRESSION_FAILED')
              emit({'offlineRegression': {'testsRun': result.testsRun, 'synthetic': True,
                                         'python': '.'.join(map(str, sys.version_info[:3])),
                                         'liveAPIRequests': 0, 'chromiumTested': False}})
          
