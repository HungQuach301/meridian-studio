          class Stop(RuntimeError):
              pass
          
          def require(condition, code):
              if not condition:
                  raise Stop(code)
          
          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'),
                                ensure_ascii=False, allow_nan=False).encode('utf-8')
          
          def sha256(value):
              return hashlib.sha256(value).hexdigest()
          
          def digest(value):
              return sha256(canonical(value))
          
          def emit(value):
              print(json.dumps(value, ensure_ascii=False, sort_keys=True), flush=True)
          
          def is_sha(value):
              return type(value) is str and re.fullmatch(r'[0-9a-f]{40}', value) is not None
          
          def is_positive_int(value):
              return type(value) is int and value > 0
          
          def runtime_guard(version):
              require(tuple(version[:3]) == (3, 12, 3), 'PYTHON_VERSION')
          
          @dataclass(frozen=True)
          class Context:
              head: str
              run_id: int
          
          def context_guard(env, event):
              expected = {'GITHUB_ACTIONS': 'true', 'GITHUB_REPOSITORY': REPO,
                          'GITHUB_ACTOR': OWNER, 'GITHUB_TRIGGERING_ACTOR': OWNER,
                          'GITHUB_EVENT_NAME': 'push', 'GITHUB_REF': 'refs/heads/' + BRANCH,
                          'GITHUB_RUN_ATTEMPT': '1'}
              require(all(env.get(k) == v for k, v in expected.items()), 'CONTEXT')
              head = env.get('GITHUB_SHA')
              run_text = env.get('GITHUB_RUN_ID', '')
              require(is_sha(head) and type(run_text) is str
                      and re.fullmatch(r'[1-9][0-9]*', run_text), 'RUN_IDENTITY')
              require(type(event) is dict and type(event.get('repository')) is dict
                      and type(event.get('sender')) is dict, 'EVENT_SCHEMA')
              require(event['repository'].get('full_name') == REPO
                      and event['repository'].get('private') is True
                      and event['sender'].get('login') == OWNER
                      and event.get('ref') == 'refs/heads/' + BRANCH
                      and event.get('before') == PREVIOUS and event.get('after') == head
                      and event.get('created') is False and event.get('deleted') is False
                      and event.get('forced') is False, 'EXISTING_BRANCH_PUSH_CHANGED')
              return Context(head, int(run_text))
          
          @dataclass
          class RawResponse:
              status: object
              body: object
              headers: dict
              complete: bool = True
              error: object = None
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          class StrictChunkedReader:
              # Read the stdlib response's buffered body stream, before chunk decoding.
              # read1 returns available body bytes before a later EOF/timeout can discard them.
              def __init__(self, stream):
                  self.stream = stream
                  self.remaining = 0
                  self.need_crlf = False
                  self.complete = False
                  self.framing_bytes = 0
          
              def framing(self, value):
                  self.framing_bytes += len(value)
                  if self.framing_bytes > 65536:
                      raise http.client.IncompleteRead(b'')
                  return value
          
              def line(self):
                  value = self.framing(self.stream.readline(65537))
                  if not value.endswith(b'\r\n') or b'\r' in value[:-2]:
                      raise http.client.IncompleteRead(b'')
                  return value[:-2]
          
              def read(self, amount):
                  if self.complete:
                      return b''
                  if self.remaining == 0:
                      if self.need_crlf:
                          if self.framing(self.stream.read(2)) != b'\r\n':
                              raise http.client.IncompleteRead(b'')
                      size = self.line().split(b';', 1)[0].rstrip(b' \t')
                      if re.fullmatch(b'[0-9a-fA-F]+', size) is None:
                          raise http.client.IncompleteRead(b'')
                      # Hex conversion is bounded by the aggregate 64 KiB framing limit.
                      self.remaining = int(size, 16)
                      if self.remaining == 0:
                          while self.line():
                              pass  # Trailer fields are ignored, but their terminating line is required.
                          self.complete = True
                          return b''
                      self.need_crlf = True
                  value = self.stream.read1(min(amount, self.remaining))
                  if not value:
                      raise http.client.IncompleteRead(b'')
                  self.remaining -= len(value)
                  return value
          
          
          class HTTPTransport:
              def __init__(self, token):
                  require(type(token) is str and bool(token), 'TOKEN_MISSING')
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())
          
              def send(self, method, path, body, timeout, limit):
                  headers = {'Authorization': 'Bearer ' + self.token,
                             'Accept': 'application/vnd.github+json',
                             'X-GitHub-Api-Version': API_VERSION}
                  if body is not None:
                      headers['Content-Type'] = 'application/json'
                  request = urllib.request.Request(API_ROOT + path, data=body,
                                                   headers=headers, method=method)
                  try:
                      try:
                          response = self.opener.open(request, timeout=timeout)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          status = response.code
                          response_headers = {k.lower(): v for k, v in response.headers.items()}
                          length_values = [v for k, v in response.headers.items()
                                           if k.lower() == 'content-length']
                          if length_values:
                              # Retain all declared lengths in the evidence header.
                              response_headers['content-length'] = ', '.join(length_values)
                          transfer_values = [v for k, v in response.headers.items()
                                             if k.lower() == 'transfer-encoding']
                          codings = [v.strip().lower() for field in transfer_values for v in field.split(',')]
                          if transfer_values:
                              response_headers['transfer-encoding'] = ', '.join(transfer_values)
                          chunks = []
                          captured = 0
                          try:
                              # HTTPError wraps the original response in fp; do not bypass error capture.
                              underlying = response.fp if isinstance(response, urllib.error.HTTPError) else response
                              # Honor valid OWS/case even when the stdlib chunked flag is false.
                              framed = codings == ['chunked'] or getattr(underlying, 'chunked', False) is True
                              reader = (StrictChunkedReader(underlying.fp)
                                        if framed and isinstance(underlying, http.client.HTTPResponse) else response)
                              while captured <= limit:
                                  chunk = reader.read(min(65536, limit + 1 - captured))
                                  if not chunk:
                                      break
                                  chunks.append(chunk)
                                  captured += len(chunk)
                          except Exception as error:
                              partial = getattr(error, 'partial', b'')
                              if isinstance(partial, bytes):
                                  chunks.append(partial[:max(0, limit + 1 - captured)])
                              return RawResponse(status, b''.join(chunks), response_headers,
                                                 False, 'RESPONSE_READ_ERROR')
                          payload = b''.join(chunks)
                          if len(payload) > limit:
                              return RawResponse(status, payload, response_headers,
                                                 False, 'RESPONSE_TOO_LARGE')
                          if transfer_values and (codings != ['chunked']
                                                  or not isinstance(underlying, http.client.HTTPResponse)):
                              return RawResponse(status, payload, response_headers,
                                                 False, 'RESPONSE_TRANSFER_ENCODING_UNSUPPORTED')
                          if length_values:
                              lengths = [v.strip() for field in length_values for v in field.split(',')]
                              if any(re.fullmatch(r'[0-9]+', v) is None for v in lengths):
                                  return RawResponse(status, payload, response_headers,
                                                     False, 'RESPONSE_CONTENT_LENGTH_INVALID')
                              # Compare decimal strings without an unbounded integer conversion.
                              declared = {v.lstrip('0') or '0' for v in lengths}
                              if len(declared) != 1:
                                  return RawResponse(status, payload, response_headers,
                                                     False, 'RESPONSE_CONTENT_LENGTH_INVALID')
                              if str(len(payload)) not in declared:
                                  # HTTPResponse.read(amount) can return EOF without raising
                                  # IncompleteRead when Content-Length has not been satisfied.
                                  return RawResponse(status, payload, response_headers,
                                                     False, 'RESPONSE_CONTENT_LENGTH_MISMATCH')
                          return RawResponse(status, payload, response_headers)
                  except Exception:
                      # Do not print exception text that might contain request details.
                      return RawResponse(None, None, {}, False, 'TRANSPORT_NO_RESPONSE')
          
          class Evidence:
              def __init__(self, sink=emit, directory=None, forbidden=()):
                  self.sink = sink
                  self.directory = directory
                  self.forbidden = tuple(x for x in forbidden if x)
                  self.sequence = 0
          
              def capture(self, method, path, phase, response, limit):
                  self.sequence += 1
                  payload = response.body
                  require(payload is None or type(payload) is bytes, 'RESPONSE_BODY_TYPE')
                  complete = (payload is not None and response.complete is True
                              and len(payload) <= limit)
                  captured = None if payload is None else payload[:limit]
                  withheld = captured is not None and any(x in captured for x in self.forbidden)
                  selected = {k.lower(): v for k, v in response.headers.items()
                              if k.lower() in ('date', 'etag', 'x-github-request-id',
                                               'content-length', 'transfer-encoding')}
                  meta = {'sequence': self.sequence, 'phase': phase, 'method': method,
                          'path': path, 'observedAtUtc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                          'status': response.status, 'headers': selected,
                          'responseComplete': complete, 'missingResponse': payload is None,
                          'truncatedOrReadIncomplete': payload is not None and not complete,
                          'bytesCaptured': None if captured is None else len(captured),
                          'sha256Captured': None if captured is None else sha256(captured),
                          'fullResponseSha256': sha256(payload) if complete else None,
                          'withheldSensitive': withheld, 'error': response.error}
                  encoded = '' if captured is None or withheld else base64.b64encode(captured).decode('ascii')
                  chunks = [encoded[i:i + CHUNK_SIZE] for i in range(0, len(encoded), CHUNK_SIZE)]
                  meta['chunkCount'] = len(chunks)
                  if self.directory is not None:
                      stem = self.directory / ('response-%04d' % self.sequence)
                      if captured is not None and not withheld:
                          stem.with_suffix('.bin').write_bytes(captured)
                      stem.with_suffix('.json').write_bytes(canonical(meta) + b'\n')
                  self.sink({'responseBegin': meta})
                  for index, chunk in enumerate(chunks):
                      self.sink({'responseChunk': {'sequence': self.sequence,
                                                  'index': index + 1, 'count': len(chunks),
                                                  'base64': chunk}})
                  self.sink({'responseEnd': {'sequence': self.sequence,
                                            'chunkCount': len(chunks),
                                            'sha256Captured': meta['sha256Captured']}})
                  require(not withheld, 'SENSITIVE_RESPONSE_WITHHELD')
          
          class API:
              def __init__(self, transport, evidence, deadline=None, clock=time.monotonic):
                  self.transport = transport
                  self.evidence = evidence
                  self.clock = clock
                  self.deadline = clock() + 260 if deadline is None else deadline
                  self.patch_attempts = 0
                  self.phase = 'context'
          
              def request(self, path, method='GET', data=None):
                  fixed = ('', '/branches/main', BRANCH_PATH, RELEASE_PATH, ASSETS_PATH,
                           '/git/matching-refs/tags/' + TAG_BEFORE,
                           '/git/matching-refs/tags/' + TAG_AFTER)
                  allowed = (path in fixed or re.fullmatch(
                      r'/git/(commits/[0-9a-f]{40}|trees/[0-9a-f]{40}\?recursive=1)', path)
                      or re.fullmatch(r'/actions/runs(/[1-9][0-9]*|\?per_page=100&page=[1-9][0-9]*)', path))
                  require(allowed, 'UNAPPROVED_API_PATH')
                  if method == 'PATCH':
                      require(path == RELEASE_PATH and type(data) is dict
                              and canonical(data) == canonical(PATCH_BODY)
                              and self.patch_attempts == 0, 'UNAPPROVED_WRITE')
                  else:
                      require(method == 'GET' and data is None, 'UNAPPROVED_METHOD')
                  remaining = self.deadline - self.clock()
                  require(remaining > 0, 'HELPER_DEADLINE')
                  body = None if data is None else canonical(data)
                  limit = RELEASE_LIMIT if path in (RELEASE_PATH, ASSETS_PATH) else OTHER_LIMIT
                  if method == 'PATCH':
                      self.patch_attempts += 1
                      self.evidence.sink({'patchAttempt': {'count': self.patch_attempts,
                          'operation': OPERATION, 'releaseId': RELEASE,
                          'payloadBytes': len(body), 'payloadSha256': sha256(body)}})
                  response = self.transport.send(method, path, body, min(20, remaining), limit)
                  recorded = False
                  if path in (RELEASE_PATH, ASSETS_PATH) or response.status != 200 or not response.complete:
                      self.evidence.capture(method, path, self.phase, response, limit)
                      recorded = True
                  require(response.status is not None, 'TRANSPORT_OUTCOME_UNKNOWN' if method == 'PATCH'
                          else 'TRANSPORT_NO_RESPONSE')
                  require(response.status == 200, 'HTTP_' + str(response.status))
                  require(type(response.body) is bytes and response.complete is True
                          and len(response.body) <= limit, response.error or 'RESPONSE_INCOMPLETE')
                  try:
                      return json.loads(response.body.decode('utf-8'))
                  except (ValueError, UnicodeError):
                      if not recorded:
                          self.evidence.capture(method, path, self.phase, response, limit)
                      raise Stop('JSON_INVALID') from None
          
          def check_main(api, context):
              repo = api.request('')
              require(repo['full_name'] == REPO and repo['private'] is True
                      and repo['default_branch'] == 'main', 'REPOSITORY_CHANGED')
              main = api.request('/branches/main')
              require(main['commit']['sha'] == SOURCE
                      and main['commit']['commit']['tree']['sha'] == TREE, 'MAIN_CHANGED')
              current = api.request(BRANCH_PATH)
              require(current['commit']['sha'] == context.head, 'HELPER_BRANCH_CHANGED')
          
          def tree_map(value, expected_sha):
              require(value.get('sha') == expected_sha and value.get('truncated') is False
                      and type(value.get('tree')) is list, 'TREE_TRUNCATED_OR_CHANGED')
              result = {}
              for entry in value['tree']:
                  if entry.get('type') == 'tree':
                      continue
                  path = entry['path']
                  require(type(path) is str and path not in result and is_sha(entry['sha']), 'TREE_ENTRY')
                  result[path] = (entry['mode'], entry['type'], entry['sha'])
              return result
          
          def check_source(api, context):
              check_main(api, context)
              previous = api.request('/git/commits/' + PREVIOUS)
              current = api.request('/git/commits/' + context.head)
              require(previous['sha'] == PREVIOUS and previous['tree']['sha'] == PREVIOUS_TREE
                      and [p['sha'] for p in previous['parents']] == [SOURCE], 'PREVIOUS_HELPER_CHANGED')
              require(current['sha'] == context.head and is_sha(current['tree']['sha'])
                      and [p['sha'] for p in current['parents']] == [PREVIOUS], 'HELPER_PARENT')
              source = tree_map(api.request('/git/trees/' + TREE + '?recursive=1'), TREE)
              old = tree_map(api.request('/git/trees/' + PREVIOUS_TREE + '?recursive=1'), PREVIOUS_TREE)
              candidate_tree = current['tree']['sha']
              new = tree_map(api.request('/git/trees/' + candidate_tree + '?recursive=1'), candidate_tree)
              require(len(source) == 112 and WORKFLOW not in source
                      and len(old) == len(new) == 113 and set(old) == set(source) | {WORKFLOW}
                      and set(new) == set(old) and all(old[p] == new[p] == source[p] for p in source)
                      and old[WORKFLOW] == ('100644', 'blob', PREVIOUS_BLOB)
                      and new[WORKFLOW][:2] == ('100644', 'blob')
                      and new[WORKFLOW][2] != PREVIOUS_BLOB, 'HELPER_SCOPE')
              return candidate_tree
          
          def read_history(api):
              result = []
              total = None
              for page in range(1, 11):
                  value = api.request('/actions/runs?per_page=100&page=' + str(page))
                  require(type(value.get('total_count')) is int
                          and 1 <= value['total_count'] <= 1000, 'HISTORY_COUNT')
                  if total is None:
                      total = value['total_count']
                  batch = value.get('workflow_runs')
                  require(value['total_count'] == total and type(batch) is list
          WP004A_SOURCE_PART_1

      - name: Stage pinned helper source part 2 of 4
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/wp004a-tag-repair-program.py"
          test ! -L "$RUNNER_TEMP/wp004a-tag-repair-program.py"
          cat >> "$RUNNER_TEMP/wp004a-tag-repair-program.py" <<'WP004A_SOURCE_PART_2'
                          and len(batch) == min(100, total - len(result)), 'HISTORY_INCOMPLETE_OR_CHANGED')
                  result.extend(batch)
                  if len(result) == total:
                      require(all(is_positive_int(r.get('id')) for r in result)
                              and len({r['id'] for r in result}) == total, 'HISTORY_DUPLICATE_OR_ID')
                      return result
              raise Stop('HISTORY_INCOMPLETE')
          
          def check_history(api, context):
              run = api.request('/actions/runs/' + str(context.run_id))
              require(run['id'] == context.run_id and run['head_sha'] == context.head
                      and run['head_branch'] == BRANCH and run['event'] == 'push'
                      and run['path'] == WORKFLOW and type(run['run_attempt']) is int
                      and run['run_attempt'] == 1 and run['status'] == 'in_progress'
                      and run['actor']['login'] == OWNER and run['triggering_actor']['login'] == OWNER,
                      'RUN_CHANGED')
              history = read_history(api)
              old = sorted([{k: r[k] for k in HISTORY_FIELDS} for r in history
                            if r['head_sha'] != context.head], key=lambda r: r['id'])
              require(len(old) == 126 and digest(old) == BASELINE_HISTORY, 'BASELINE_HISTORY_CHANGED')
              own = [r for r in history if r['head_sha'] == context.head]
              require(1 <= len(own) <= 3 and len({r['path'] for r in own}) == len(own)
                      and all(r['path'] in (WORKFLOW, '.github/workflows/ci.yml', '.github/workflows/hello.yml')
                              and r['event'] == 'push' and r['head_branch'] == BRANCH
                              and type(r['run_attempt']) is int and r['run_attempt'] == 1 for r in own)
                      and [r['id'] for r in own if r['path'] == WORKFLOW] == [context.run_id],
                      'REPAIR_ALREADY_ATTEMPTED_OR_UNEXPECTED_RUN')
              return len(history)
          
          def release_predicates(value, tag):
              require(type(value) is dict, 'RELEASE_SCHEMA')
              rows = []
              def add(field, expected, code, valid_type):
                  present = field in value
                  actual = value.get(field)
                  rows.append({'field': field, 'present': present, 'expected': expected,
                               'observed': actual, 'observedType': type(actual).__name__,
                               'pass': present and valid_type(actual) and actual == expected, 'code': code})
              add('id', RELEASE, 'RELEASE_ID_MISMATCH', lambda x: type(x) is int)
              add('tag_name', tag, 'RELEASE_TAG_MISMATCH', lambda x: type(x) is str)
              add('target_commitish', SOURCE, 'RELEASE_TARGET_MISMATCH', lambda x: type(x) is str)
              add('draft', True, 'DRAFT_FLAG_MISMATCH', lambda x: type(x) is bool)
              add('prerelease', False, 'PRERELEASE_FLAG_MISMATCH', lambda x: type(x) is bool)
              add('published_at', None, 'PUBLISHED_AT_MISMATCH', lambda x: x is None)
              add('assets', [], 'RELEASE_ASSETS_NOT_EMPTY', lambda x: type(x) is list)
              for key, expected_hash, code in (('name', NAME_SHA, 'RELEASE_NAME_CHANGED'),
                                                ('body', BODY_SHA, 'RELEASE_BODY_CHANGED')):
                  actual = value.get(key)
                  actual_hash = sha256(actual.encode('utf-8')) if type(actual) is str else None
                  rows.append({'field': key, 'expectedSha256': expected_hash,
                               'observedSha256': actual_hash, 'observedType': type(actual).__name__,
                               'pass': actual_hash == expected_hash, 'code': code})
              for key, expected_type in (('node_id', str), ('created_at', str), ('author', dict)):
                  rows.append({'field': key, 'present': key in value,
                               'observedType': type(value.get(key)).__name__,
                               'pass': key in value and type(value[key]) is expected_type,
                               'code': 'RELEASE_PRESERVE_FIELD_MISSING_OR_TYPE'})
              return rows
          
          def validate_release(api, value, tag, assets=None, with_assets=False):
              rows = release_predicates(value, tag)
              if with_assets:
                  rows.append({'field': 'assetsEndpoint', 'expected': [], 'observed': assets,
                               'observedType': type(assets).__name__,
                               'pass': type(assets) is list and assets == [], 'code': 'ASSET_ENDPOINT_NOT_EMPTY'})
              api.evidence.sink({'releasePredicates': {'phase': api.phase, 'checks': rows}})
              failed = [r['code'] for r in rows if not r['pass']]
              require(not failed, '|'.join(failed))
          
          def check_refs(api):
              for tag in (TAG_BEFORE, TAG_AFTER):
                  require(api.request('/git/matching-refs/tags/' + tag) == [], 'TAG_REF_CHANGED')
          
          def check_release(api, tag):
              value = api.request(RELEASE_PATH)
              assets = api.request(ASSETS_PATH)
              validate_release(api, value, tag, assets, True)
              check_refs(api)
              return value
          
          def compare_preserved(before, after):
              require(before['tag_name'] == TAG_BEFORE and after['tag_name'] == TAG_AFTER,
                      'RELEASE_TAG_TRANSITION')
              changed = [k for k in PRESERVE if k not in before or k not in after
                         or type(before[k]) is not type(after[k]) or before[k] != after[k]]
              require(not changed, 'RELEASE_FIELDS_CHANGED:' + ','.join(changed))
          
          def repair(api, context):
              api.phase = 'source-and-history'
              candidate_tree = check_source(api, context)
              check_history(api, context)
              api.phase = 'before-patch'
              before = check_release(api, TAG_BEFORE)
              # Refresh provenance/history before the single write. No atomicity claim.
              check_main(api, context)
              check_history(api, context)
              api.phase = 'patch'
              patched = api.request(RELEASE_PATH, 'PATCH', PATCH_BODY)
              validate_release(api, patched, TAG_AFTER)
              compare_preserved(before, patched)
              api.phase = 'after-patch'
              after = check_release(api, TAG_AFTER)
              compare_preserved(before, after)
              check_main(api, context)
              api.phase = 'history-final'
              count = check_history(api, context)
              receipt = {'operation': OPERATION, 'runId': context.run_id, 'attempt': 1,
                         'patchCount': api.patch_attempts, 'helperBefore': PREVIOUS,
                         'helperCommit': context.head, 'helperTree': candidate_tree,
                         'sourceCommit': SOURCE, 'sourceTree': TREE, 'releaseId': RELEASE,
                         'beforeTag': TAG_BEFORE, 'afterTag': TAG_AFTER, 'target': SOURCE,
                         'draft': True, 'prerelease': False, 'publishedAt': None, 'assets': [],
                         'releaseNameSha256': NAME_SHA, 'releaseBodySha256': BODY_SHA,
                         'baselineHistorySha256': BASELINE_HISTORY, 'observedHistoryCount': count,
                         'retainedFailures': {'34703610757': 'DRAFT_CHANGED',
                                              '34690874856': 'RELEASE_COUNT_CHANGED'},
                         'patchPayloadSha256': digest(PATCH_BODY),
                         'benchmarkExecuted': False, 'browserExecuted': False,
                         'ciHelloReadbackRequired': True, 'benchmarkCommandAuthorizedByRepair': False}
              api.evidence.sink({'tagRepairReceipt': receipt, 'receiptSha256': digest(receipt)})
              return receipt
          
          # SYNTHETIC fixtures below only exercise client logic. No live credentials,
          # environment rewriting, GitHub call, browser or benchmark is used by tests.
          class SyntheticTransport:
              HEAD = 'c' * 40
              HEAD_TREE = 'd' * 40
              RUN = 90000000001
          
              def __init__(self):
                  self.calls = []
                  self.hooks = {}
                  self.write_response = None
                  self.written = False
                  self.release = {'id': RELEASE, 'node_id': 'SYNTHETIC_RELEASE',
                      'tag_name': TAG_BEFORE, 'target_commitish': SOURCE, 'draft': True,
                      'prerelease': False, 'published_at': None, 'assets': [],
                      'name': 'SYNTHETIC NAME', 'body': 'SYNTHETIC BODY — không phải authorization\n',
                      'author': {'login': 'SYNTHETIC_AUTHOR'}, 'created_at': 'SYNTHETIC_TIME'}
                  self.api_assets = []
                  self.source = [{'path': 'synthetic/file-%03d' % i, 'mode': '100644',
                                  'type': 'blob', 'sha': '%040x' % (i + 1)} for i in range(112)]
                  self.previous = copy.deepcopy(self.source) + [{'path': WORKFLOW, 'mode': '100644',
                                                                 'type': 'blob', 'sha': PREVIOUS_BLOB}]
                  self.candidate = copy.deepcopy(self.previous)
                  self.candidate[-1]['sha'] = 'e' * 40
                  self.run = {'id': self.RUN, 'head_sha': self.HEAD, 'head_branch': BRANCH,
                              'event': 'push', 'path': WORKFLOW, 'run_attempt': 1,
                              'status': 'in_progress', 'conclusion': None,
                              'actor': {'login': OWNER}, 'triggering_actor': {'login': OWNER}}
                  self.old = [{'id': i + 1000, 'path': '.github/workflows/ci.yml', 'event': 'push',
                               'head_sha': SOURCE, 'run_attempt': 1, 'status': 'completed',
                               'conclusion': 'success'} for i in range(124)]
                  for run_id in (34690874856, 34703610757):
                      self.old.append({'id': run_id, 'path': WORKFLOW, 'event': 'push',
                                       'head_sha': PREVIOUS, 'run_attempt': 1,
                                       'status': 'completed', 'conclusion': 'failure'})
                  self.history = copy.deepcopy(self.old) + [copy.deepcopy(self.run)]
          
              @staticmethod
              def raw(value, status=200):
                  return RawResponse(status, canonical(value), {'ETag': 'SYNTHETIC_ETAG'})
          
              def send(self, method, path, body, timeout, limit):
                  self.calls.append((method, path, body))
                  hook = self.hooks.get((method, path))
                  if hook is not None:
                      return hook(self) if callable(hook) else hook
                  if method == 'PATCH':
                      self.written = True
                      if self.write_response is not None:
                          return copy.deepcopy(self.write_response)
                      self.release.update(json.loads(body))
                      return self.raw(self.release)
                  if path == '':
                      return self.raw({'full_name': REPO, 'private': True, 'default_branch': 'main'})
                  if path == '/branches/main':
                      return self.raw({'commit': {'sha': SOURCE, 'commit': {'tree': {'sha': TREE}}}})
                  if path == BRANCH_PATH:
                      return self.raw({'commit': {'sha': self.HEAD}})
                  if path == '/git/commits/' + PREVIOUS:
                      return self.raw({'sha': PREVIOUS, 'tree': {'sha': PREVIOUS_TREE},
                                       'parents': [{'sha': SOURCE}]})
                  if path == '/git/commits/' + self.HEAD:
                      return self.raw({'sha': self.HEAD, 'tree': {'sha': self.HEAD_TREE},
                                       'parents': [{'sha': PREVIOUS}]})
                  trees = {TREE: self.source, PREVIOUS_TREE: self.previous, self.HEAD_TREE: self.candidate}
                  for key, entries in trees.items():
                      if path == '/git/trees/' + key + '?recursive=1':
                          return self.raw({'sha': key, 'truncated': False, 'tree': entries})
                  if path == RELEASE_PATH:
                      return self.raw(self.release)
                  if path == ASSETS_PATH:
                      return self.raw(self.api_assets)
                  if path.startswith('/git/matching-refs/tags/'):
                      return self.raw([])
                  if path == '/actions/runs/' + str(self.RUN):
                      return self.raw(self.run)
                  if path.startswith('/actions/runs?per_page=100&page='):
                      page = int(path.rsplit('=', 1)[1])
                      return self.raw({'total_count': len(self.history),
                                       'workflow_runs': self.history[(page - 1) * 100:page * 100]})
                  raise AssertionError('Unexpected synthetic path: ' + path)
          
          class RepairTests(unittest.TestCase):
              def setUp(self):
                  self.transport = SyntheticTransport()
                  self.events = []
                  self.api = API(self.transport, Evidence(self.events.append))
                  self.context = Context(self.transport.HEAD, self.transport.RUN)
                  self.constants = patch.dict(globals(), {
                      'NAME_SHA': sha256(self.transport.release['name'].encode()),
                      'BODY_SHA': sha256(self.transport.release['body'].encode()),
                      'BASELINE_HISTORY': digest(self.transport.old)})
                  self.constants.start()
                  self.addCleanup(self.constants.stop)
          
              def writes(self):
                  return [x for x in self.transport.calls if x[0] == 'PATCH']
          
              def fails(self, code, writes=0):
                  with self.assertRaisesRegex(Stop, code):
                      repair(self.api, self.context)
                  self.assertEqual(len(self.writes()), writes)
          
              def environment(self):
                  return {'GITHUB_ACTIONS': 'true', 'GITHUB_REPOSITORY': REPO,
                          'GITHUB_ACTOR': OWNER, 'GITHUB_TRIGGERING_ACTOR': OWNER,
                          'GITHUB_EVENT_NAME': 'push', 'GITHUB_REF': 'refs/heads/' + BRANCH,
                          'GITHUB_RUN_ATTEMPT': '1', 'GITHUB_SHA': self.context.head,
                          'GITHUB_RUN_ID': str(self.context.run_id)}
          
              def event(self):
                  return {'repository': {'full_name': REPO, 'private': True},
                          'sender': {'login': OWNER}, 'ref': 'refs/heads/' + BRANCH,
