              def memory_http_transport(self, wire):
                  # Real stdlib HTTP parsing, with an in-memory stream and no socket.
                  calls = []
                  class MemorySocket:
                      def makefile(self, *args, **kwargs):
                          return io.BytesIO(wire)
                  class MemoryOpener:
                      def open(self, request, timeout):
                          calls.append(request)
                          response = http.client.HTTPResponse(MemorySocket())
                          response.begin()
                          return response
                  transport = HTTPTransport('SYNTHETIC_NOT_A_CREDENTIAL')
                  transport.opener = MemoryOpener()
                  return transport, calls
          
