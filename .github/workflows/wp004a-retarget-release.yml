name: WP-004a repair approved draft tag (separate owner approval)

# OFFLINE CANDIDATE. A push to this existing helper branch executes a real write.
# Require a separate owner approval before committing/pushing. Never merge to main.
on:
  push:
    branches: ['wp/WP-004a-retarget-2e068c4']
    paths: ['.github/workflows/wp004a-retarget-release.yml']

permissions: {}
concurrency:
  group: wp004a-canvas-spike
  cancel-in-progress: false

jobs:
  retarget:
    if: github.repository == 'HungQuach301/meridian-studio' && github.actor == 'HungQuach301' && github.triggering_actor == 'HungQuach301' && github.event_name == 'push' && github.ref == 'refs/heads/wp/WP-004a-retarget-2e068c4' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Stage pinned helper source part 1 of 4
        shell: bash
        run: |
          umask 077
          set -o noclobber
          cat > "$RUNNER_TEMP/wp004a-tag-repair-program.py" <<'WP004A_SOURCE_PART_1'
