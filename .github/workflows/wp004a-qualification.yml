name: WP004a qualification (separate execution approval)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged workflow commit approved for one attempt
        required: true
        type: string
      decision_sha256:
        description: Reviewed E-QUAL-01 decision digest
        required: true
        type: string
      qualification_id:
        description: Approved one-use qualification identifier
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: wp004a-qualification-01
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'HungQuach301/meridian-studio' && github.actor == 'HungQuach301' && github.triggering_actor == 'HungQuach301' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: One qualification and synthetic validation attempt
        shell: bash
        env:
          QV_SOURCE_SHA: ${{ inputs.source_sha }}
          QV_DECISION_SHA256: ${{ inputs.decision_sha256 }}
          QV_NONCE: ${{ inputs.qualification_id }}
          QV_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=2s 1100s /usr/bin/python3 -I - <<'PY_QV'
          # E-QUAL-01 source only. NOT RUN during QV preparation.
          import base64, hashlib, json, os, re, selectors, signal, subprocess, sys, time, zlib
          from pathlib import Path, PurePosixPath
          REPO='HungQuach301/meridian-studio'
          OWNER='HungQuach301'
          BRANCH='evidence/wp004a-qualification-01'
          PREFIX='evidence/wp004a-qualification/01/'
          NONCE='wp004a-qualification-01'
          DECISION='42b672b623f2e3d19cd29b19c64d41a82e839b11fd347afbaafcb8da9d133614'
          CAPSULE_SHA='d7cca6b74cd1e72c8ba5a84c038ff94d7c537a0a4e97624525258437c527d2ad'
          CAPSULE_B64=''
          CAP=65536
          started=time.monotonic()
          os.umask(0o077)
          def require(ok,code):
              if not ok: raise RuntimeError(code)
          def sha(b): return hashlib.sha256(b).hexdigest()
          def encode(v): return (json.dumps(v,ensure_ascii=True,sort_keys=True,separators=(',',':'),allow_nan=False)+'\n').encode('ascii')
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def read_limited(p,cap):
              with open(p,'rb') as f: b=f.read(cap+1)
              require(len(b)<=cap,'READ_CAP');return b
          
          def file_pin(p,cap=134217728):
              h=hashlib.sha256();total=0
              with open(p,'rb') as f:
                  while True:
                      b=f.read(1048576)
                      if not b:break
                      total+=len(b);require(total<=cap,'BINARY_CAP');h.update(b)
              return {'path':str(p),'bytes':total,'sha256':h.hexdigest()}
          
          require(sys.version_info[:2]==(3,12),'PYTHON_3_12')
          require(os.environ.get('RUNNER_OS')=='Linux' and os.environ.get('RUNNER_ARCH')=='X64','LINUX_X64_REQUIRED')
          require(os.environ.get('GITHUB_REPOSITORY')==REPO,'REPO')
          require(os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch','EVENT')
          require(os.environ.get('GITHUB_REF')=='refs/heads/main','REF')
          require(os.environ.get('GITHUB_ACTOR')==OWNER and os.environ.get('GITHUB_TRIGGERING_ACTOR')==OWNER,'ACTOR')
          require(os.environ.get('GITHUB_RUN_ATTEMPT')=='1','ATTEMPT')
          source=os.environ.get('QV_SOURCE_SHA','')
          require(re.fullmatch(r'[0-9a-f]{40}',source) and source!='0'*40,'SOURCE_FORMAT')
          require(source==os.environ.get('GITHUB_SHA')==os.environ.get('GITHUB_WORKFLOW_SHA'),'SOURCE_BINDING')
          require(os.environ.get('GITHUB_WORKFLOW_REF')==REPO+'/.github/workflows/wp004a-qualification.yml@refs/heads/main','WORKFLOW_REF')
          require(os.environ.get('QV_DECISION_SHA256')==DECISION and os.environ.get('QV_NONCE')==NONCE,'DECISION_NONCE')
          run=os.environ.get('GITHUB_RUN_ID','');require(re.fullmatch(r'[1-9][0-9]*',run),'RUN_ID')
          token=os.environ.pop('QV_TOKEN','');require(bool(token),'TOKEN_MISSING')
          root=Path(os.environ['RUNNER_TEMP']).resolve()/('wp004a-qualification-'+run+'-1')
          root.mkdir(mode=0o700,exist_ok=False);os.chdir(root)
          for name in ['home','cache','tmp','records']: (root/name).mkdir()
          clean={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8','LC_ALL':'C.UTF-8','TZ':'UTC','HOME':str(root/'home'),'TMPDIR':str(root/'tmp'),'CI':'true'}
          identity={'repository':REPO,'sourceCommit':source,'runId':run,'attempt':1,'decisionSHA256':DECISION,'nonce':NONCE,'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],'capsuleSHA256':CAPSULE_SHA}
          files=[];attempted_files=[];receipts=[];api_failed=False;commands=[];source_entries=[];runtime={};phase='bootstrap';primary=None;checkpoint_done=False
          # No runtime import of project code in this controller.
          
          UPLOADER = r'''
          import base64, hashlib, http.client, json, ssl, sys
          request = json.loads(sys.stdin.buffer.read(120000))
          payload = request['payload'].encode('ascii')
          connection = http.client.HTTPSConnection('api.github.com', timeout=8,
                                                  context=ssl.create_default_context())
          record = {'status': None, 'headersView': None, 'responseBodyBase64': None,
                    'wireHeaders': None, 'error': None}
          try:
              connection.request('PUT', request['path'], body=payload, headers={
                  'Authorization': 'Bearer ' + request['token'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'User-Agent': 'Meridian-WP004a-qualification-01'})
              response = connection.getresponse()
              record['status'] = response.status
              headers = response.getheaders()
              header_bytes = json.dumps(headers, ensure_ascii=True).encode('ascii')
              if len(header_bytes) > 32768:
                  raise RuntimeError('HEADER_CAPTURE_CAP')
              # This is a parsed header view, not a raw wire-header guarantee.
              record['headersView'] = headers
              body = response.read(262145)
              record['responseBodyBytesObserved'] = len(body)
              record['responseBodySHA256'] = hashlib.sha256(body).hexdigest()
              record['responseBodyBase64'] = base64.b64encode(body[:262144]).decode('ascii')
              record['bodyComplete'] = len(body) <= 262144
              if len(body) > 262144:
                  raise RuntimeError('RESPONSE_CAP')
              if response.status != 201:
                  raise RuntimeError('HTTP_STATUS_NOT_201')
          except Exception as error:
              record['error'] = type(error).__name__ + (':' + str(error) if isinstance(error, RuntimeError) else '')
          finally:
              connection.close()
          print(json.dumps(record, ensure_ascii=True, separators=(',', ':')))
          '''
          
          def capture_record(name, value):
              data = encode(value)
              require(len(data) <= 524288, 'RECEIPT_CAP')
              require(sum(p.stat().st_size for p in (root / "records").iterdir() if p.is_file()) + len(data) <= 8 * 1024 * 1024, "RECORD_CAP")
              with open(root / 'records' / name, 'xb') as stream:
                  stream.write(data)
                  stream.flush()
                  os.fsync(stream.fileno())
              # Logs are a secondary channel. Remote files/readback remain necessary.
              print('QV_RECEIPT ' + base64.b64encode(data).decode('ascii'), flush=True)
          
          def upload(name, document):
              global api_failed
              require(not api_failed and name in ('boot.json', 'checkpoint.json', 'final.json'), 'UPLOAD_GUARD')
              require(time.monotonic() - started < 1080, 'PAYLOAD_DEADLINE')
              require(name not in attempted_files, 'NO_DUPLICATE_WRITE')
              attempted_files.append(name)
              data = encode(document)
              require(len(data) <= CAP and sum(f['bytes'] for f in files) + len(data) <= 3 * CAP, 'OUTPUT_CAP')
              require(sum(p.stat().st_size for p in (root / "records").iterdir() if p.is_file()) + len(data) <= 8 * 1024 * 1024, "RECORD_CAP")
              with open(root / 'records' / name, 'xb') as stream:
                  stream.write(data)
                  stream.flush()
                  os.fsync(stream.fileno())
              print('QV_DOCUMENT ' + name + ' ' + base64.b64encode(data).decode('ascii'), flush=True)
              expected_blob = blob(data)
              payload = encode({'message': 'evidence: WP004a qualification ' + name,
                                'branch': BRANCH, 'content': base64.b64encode(data).decode('ascii')})
              request = encode({'token': token, 'path': '/repos/' + REPO + '/contents/' + PREFIX + name,
                                'payload': payload.decode('ascii')})
              require(len(request) < 120000, 'REQUEST_CAP')
              process = subprocess.Popen([sys.executable, '-I', '-c', UPLOADER],
                                         stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                         stderr=subprocess.PIPE, env=clean, start_new_session=True)
              try:
                  stdout, stderr = process.communicate(request, timeout=10)
              except subprocess.TimeoutExpired:
                  api_failed = True
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  stdout, stderr = process.communicate(timeout=2)
                  capture_record(name + '.receipt.json', {'status': None, 'error': 'UPLOADER_TIMEOUT_OUTCOME_UNKNOWN',
                                                         'stdoutBase64': base64.b64encode(stdout[:262144]).decode(),
                                                         'stderrSHA256': sha(stderr), 'requestFileSHA256': sha(data)})
                  raise RuntimeError('UPLOAD_OUTCOME_UNKNOWN')
              try:
                  require(process.returncode == 0 and len(stdout) <= 524288 and len(stderr) <= 8192, 'UPLOADER_PROCESS')
                  result = json.loads(stdout)
                  capture_record(name + '.receipt.json', result)
                  require(result['error'] is None and result['status'] == 201 and result['bodyComplete'], 'UPLOAD_RESPONSE')
                  api = json.loads(base64.b64decode(result['responseBodyBase64']))
                  require(api['content']['path'] == PREFIX + name and api['content']['sha'] == expected_blob,
                          'UPLOADED_BLOB_BINDING')
                  commit = api['commit']['sha']
                  require(re.fullmatch('[0-9a-f]{40}', commit), 'COMMIT_FORMAT')
                  require(api['commit']['tree']['sha'] and api['commit']['parents'], 'COMMIT_RECEIPT_INCOMPLETE')
                  if receipts:
                      require([p['sha'] for p in api['commit']['parents']] == [receipts[-1]['commit']], 'EVIDENCE_PARENT')
                  else:
                      require([p['sha'] for p in api['commit']['parents']] == [source], 'EVIDENCE_BRANCH_BASE')
                  receipt = {'name': name, 'bytes': len(data), 'sha256': sha(data), 'blob': expected_blob,
                             'commit': commit, 'responseBodySHA256': result['responseBodySHA256'], 'status': 201}
                  receipts.append(receipt)
                  files.append({'name': name, 'bytes': len(data)})
                  print('QV_COMMIT ' + encode(receipt).decode('ascii').strip(), flush=True)
              except Exception:
                  api_failed = True
                  raise
          
          def disk_observation():
              total=0;count=0
              for base,dirs,names in os.walk(root,followlinks=False):
                  dirs[:]=[d for d in dirs if not (Path(base)/d).is_symlink()]
                  for name in names:
                      p=Path(base)/name
                      if not p.is_symlink():total+=p.stat().st_size;count+=1
                      require(count<=200000,'SCRATCH_FILE_COUNT')
              return {'regularFileBytes':total,'regularFiles':count,'filesystemOverhead':None,'hardQuota':False}
          
          def run_cmd(label,argv,cwd,env,deadline,stream_cap):
              require(time.monotonic()<deadline,'COMMAND_DEADLINE_BEFORE_START')
              intent={'label':label,'argv':argv,'cwd':str(cwd),'environment':env,'deadlineMonotonic':deadline,'streamCapBytes':stream_cap,'retry':False}
              print('QV_INTENT '+base64.b64encode(encode(intent)).decode(),flush=True)
              btime=time.monotonic();p=subprocess.Popen(argv,cwd=cwd,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
              sel=selectors.DefaultSelector();sel.register(p.stdout,selectors.EVENT_READ,'stdout');sel.register(p.stderr,selectors.EVENT_READ,'stderr')
              raw={'stdout':bytearray(),'stderr':bytearray()};seen={'stdout':0,'stderr':0};eof={'stdout':False,'stderr':False};supervisor_error=None;cleanup_errors=[];reason=None;term=None;kill=None;drain=time.monotonic();observations=[]
              try:
                  while sel.get_map() or p.poll() is None or (term is not None and kill is None):
                      now=time.monotonic()
                      if reason is None and now>=deadline:reason='TIMEOUT'
                      if now-drain>=2 and reason is None:
                          try:
                              obs=disk_observation();observations.append(obs);observations=observations[-3:]
                              if obs['regularFileBytes']>2147483648:reason='SCRATCH_OBSERVED_OVER_2GIB'
                          except Exception:reason='SCRATCH_OBSERVATION_FAILED'
                          drain=time.monotonic()
                      if reason and term is None:
                          try:os.killpg(p.pid,signal.SIGTERM)
                          except ProcessLookupError:pass
                          term=time.monotonic()
                      if term is not None and now-term>=2 and kill is None:
                          try:os.killpg(p.pid,signal.SIGKILL)
                          except ProcessLookupError:pass
                          kill=time.monotonic()
                      if kill is not None and now-kill>=2:break
                      for key,_ in sel.select(0.1):
                          chunk=os.read(key.fileobj.fileno(),4096)
                          if not chunk:eof[key.data]=True;sel.unregister(key.fileobj);key.fileobj.close();continue
                          name=key.data;seen[name]+=len(chunk);room=stream_cap-len(raw[name]);raw[name].extend(chunk[:max(0,room)])
                          if seen[name]>stream_cap and reason is None:reason='CAPTURE_LIMIT'
              except Exception as error:
                  reason=reason or 'SUPERVISOR_ERROR';supervisor_error=type(error).__name__+':'+str(error)[:512]
                  try:os.killpg(p.pid,signal.SIGKILL);kill=time.monotonic()
                  except ProcessLookupError:pass
                  except Exception as kill_error:cleanup_errors.append(type(kill_error).__name__)
              finally:
                  for key in list(sel.get_map().values()):
                      try:key.fileobj.close()
                      except Exception as close_error:cleanup_errors.append(type(close_error).__name__)
                  sel.close()
              try:exit_code=p.wait(timeout=0.2)
              except subprocess.TimeoutExpired:exit_code=None
              record={**intent,'exitCode':exit_code,'stopReason':reason,'elapsedSeconds':time.monotonic()-btime,'terminationRequested':term is not None,'killRequested':kill is not None,'processExitObserved':exit_code is not None,'scratchObservations':observations,'supervisorError':supervisor_error,'cleanupErrors':cleanup_errors,'processTreeExitProven':None,'streams':{}}
              for name,b in raw.items():record['streams'][name]={'capturedBytes':len(b),'observedBytes':seen[name],'sha256':sha(b),'base64':base64.b64encode(b).decode(),'complete':eof[name] and seen[name]<=stream_cap}
              data=encode(record);require(len(data)<131072,'COMMAND_RECORD_CAP');(root/'records'/f'{label}.json').write_bytes(data);commands.append(record)
              print('QV_COMMAND '+base64.b64encode(data).decode(),flush=True)
              require(exit_code==0 and reason is None and not cleanup_errors and all(x['complete'] for x in record['streams'].values()),'COMMAND_FAILED:'+label)
              return bytes(raw['stdout'])
          
          def stage_capsule():
              packed=base64.b64decode(CAPSULE_B64,validate=True);require(len(packed)<=524288,'COMPRESSED_CAP')
              decoder=zlib.decompressobj();raw=decoder.decompress(packed,2097153)
              require(len(raw)<=2097152 and decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail,'CAPSULE_EXPANSION')
              require(sha(raw)==CAPSULE_SHA,'CAPSULE_PIN')
              doc=json.loads(raw);require(doc['repository']==REPO,'CAPSULE_REPO')
              require(len(doc['files'])<=32,'CAPSULE_COUNT');used=set();total=0
              for item in doc['files']:
                  path=PurePosixPath(item['path']);require(not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('project','validation'),'CAPSULE_PATH')
                  require(str(path) not in used,'DUPLICATE_PATH');used.add(str(path))
                  data=item['text'].encode('utf-8');total+=len(data)
                  require(len(data)==item['bytes'] and sha(data)==item['sha256'] and len(data)<=1048576 and total<=4194304,'SOURCE_PIN_CAP')
                  target=root/str(path);target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as f:f.write(data)
                  source_entries.append({k:item[k] for k in ('path','bytes','sha256')})
              require(doc['caseIds'] and len(doc['caseIds'])==42 and len(set(doc['caseIds']))==42,'CASE_IDS')
              return doc
          
          def source_guard():
              for entry in source_entries:
                  data=read_limited(root/entry['path'],1048576)
                  require(len(data)==entry['bytes'] and sha(data)==entry['sha256'],'SOURCE_CHANGED:'+entry['path'])
          
          def limited_engine_support(spec,version):
              # Conservative supported subset only; unknown grammar fails closed, never guessed.
              clauses=spec.split('||');accepted=False
              for raw in clauses:
                  m=re.fullmatch(r'\s*(\^|>=)(\d+)\.(\d+)\.(\d+)\s*',raw)
                  require(m is not None,'NPM_ENGINE_GRAMMAR_UNSUPPORTED')
                  floor=tuple(map(int,m.groups()[1:]));accepted|=version>=floor and (m[1]!='^' or version[0]==floor[0])
              return accepted
          
          def qualify_runtime():
              global clean
              cache=Path(os.environ.get('RUNNER_TOOL_CACHE','/path-not-provided')).resolve();require(cache.is_dir(),'TOOLCACHE_UNAVAILABLE')
              node_root=cache/'node';require(node_root.is_dir(),'NODE20_TOOLCACHE_UNAVAILABLE')
              choices=[]
              for p in node_root.iterdir():
                  m=re.fullmatch(r'20\.(\d+)\.(\d+)',p.name)
                  if m and (20,int(m[1]),int(m[2]))>=(20,19,0) and (p/'x64/bin/node').is_file():choices.append(((20,int(m[1]),int(m[2])),p/'x64'))
              require(bool(choices),'NODE20_COMPATIBLE_UNAVAILABLE');choices.sort(reverse=True,key=lambda x:x[0]);version,prefix=choices[0];prefix=prefix.resolve();require(prefix.is_relative_to(cache),'TOOLCACHE_ESCAPE')
              node=(prefix/'bin/node').resolve();npm_dir=(prefix/'lib/node_modules/npm').resolve();npm_cli=(npm_dir/'bin/npm-cli.js').resolve()
              require(node.is_relative_to(prefix) and npm_cli.is_relative_to(prefix),'RUNTIME_PATH_ESCAPE')
              package=json.loads(read_limited(npm_dir/'package.json',65536));require(package['name']=='npm','NPM_IDENTITY')
              require(limited_engine_support(package['engines']['node'],version),'NPM_NODE_INCOMPATIBLE')
              pins={'node':file_pin(node),'npmCLI':file_pin(npm_cli),'npmPackage':file_pin(npm_dir/'package.json')}
              clean={**clean,'PATH':str(node.parent)+':/usr/bin:/bin'}
              nv=run_cmd('node-version',[str(node),'--version'],root,clean,started+90,1024).decode().strip();require(nv=='v'+'.'.join(map(str,version)),'NODE_VERSION_MISMATCH')
              npm_v=run_cmd('npm-version',[str(node),str(npm_cli),'--version'],root,clean,started+90,1024).decode().strip();require(npm_v==package['version'],'NPM_VERSION_MISMATCH')
              runtime.update({'nodeVersion':nv,'npmVersion':npm_v,'npmEngines':package['engines']['node'],'pins':pins,'toolcacheChoices':[{'version':'.'.join(map(str,x[0])),'path':str(x[1])} for x in choices],
                 'imageOS':os.environ.get('ImageOS'),'imageVersion':os.environ.get('ImageVersion'),'runnerOS':os.environ.get('RUNNER_OS'),'runnerArch':os.environ.get('RUNNER_ARCH'),'pythonVersion':sys.version,'pythonPin':file_pin(Path(sys.executable).resolve()),
                 'nodeArchivePin':None,'trustedProvenance':None,'npmTransitiveBootstrapClosurePin':None,'CPUorRAMHardLimit':None})
              runtime_guard();return str(node),str(npm_cli)
          
          def runtime_guard():
              for p in runtime.get('pins',{}).values():require(file_pin(Path(p['path']))==p,'RUNTIME_PIN_CHANGED')
          
          def dependency_inventory():
              lock=json.loads((root/'project/package-lock.json').read_bytes());installed=json.loads(read_limited(root/'project/node_modules/.package-lock.json',2097152));entries=[];missing=[]
              for path,value in installed['packages'].items():
                  if not path:continue
                  require(path in lock['packages'],'EXTRA_INSTALLED_POSITION')
                  expected=lock['packages'][path]
                  for key in ('version','resolved','integrity'):require(value.get(key)==expected.get(key),'INSTALLED_LOCK_MISMATCH:'+path+':'+key)
                  target=(root/'project'/path).resolve();require(target.is_relative_to(root/'project/node_modules'),'INSTALLED_PATH_ESCAPE')
                  package=json.loads(read_limited(target/'package.json',1048576));require(package['version']==expected['version'],'PACKAGE_VERSION_MISMATCH')
                  entries.append({'path':path,'version':package['version'],'resolved':expected['resolved'],'integrity':expected['integrity']})
              for path,value in lock['packages'].items():
                  if path and path not in installed['packages']:
                      missing.append({'path':path,'optional':value.get('optional',False)});require(value.get('optional') is True,'NONOPTIONAL_ABSENT:'+path)
              result={'installed':entries,'absent':missing,'fullInstalledFileSRIProof':None,'lifecycleScriptsRun':False,'lockUnchanged':True}
              raw=encode(result);require(len(raw)<=262144,'INVENTORY_CAP');(root/'records/dependency-inventory.json').write_bytes(raw)
              print('QV_INVENTORY '+base64.b64encode(raw).decode(),flush=True)
              return {'installedCount':len(entries),'absentCount':len(missing),'inventoryBytes':len(raw),'inventorySHA256':sha(raw),'fullInventoryChannel':'QV_INVENTORY in same-run log; required in readback','downloadBytes':None,'wireHeaders':None,'npmHTTPCount':None,'peakScratchBytes':None}
          
          def exception_record(error):
              return {'type':type(error).__name__,'message':str(error)[:2048],'phase':phase}
          
          try:
              doc=stage_capsule();source_guard();node,npm_cli=qualify_runtime()
              upload('boot.json',{'identity':identity,'phase':'RUNTIME_QUALIFIED_FOR_THIS_JOB','runtime':runtime,'sources':source_entries,'commands':commands,'productionIO':None,'productionPrivacy':None,'WP004a':'NOT_ACCEPTED'})
              phase='dependency';runtime_guard();source_guard()
              user_config=root/'user.npmrc';user_config.write_text('')
              global_config=root/'global.npmrc';global_config.write_text('')
              install_env={**clean,'npm_config_userconfig':str(user_config),'npm_config_globalconfig':str(global_config),'npm_config_cache':str(root/'cache'),'npm_config_registry':'https://registry.npmjs.org','npm_config_fetch_retries':'0','npm_config_fetch_timeout':'15000','npm_config_progress':'false','npm_config_update_notifier':'false','npm_config_audit':'false','npm_config_fund':'false','npm_config_ignore_scripts':'true'}
              run_cmd('install',[node,npm_cli,'ci','--ignore-scripts','--no-audit','--no-fund'],root/'project',install_env,started+480,8192)
              runtime_guard();source_guard();inventory=dependency_inventory()
              (root/'validation/node_modules').symlink_to('../project/node_modules',target_is_directory=True)
              validation_started=time.monotonic()
              phase='candidate-typecheck';run_cmd('candidate-typecheck',[node,str(root/'project/node_modules/typescript/bin/tsc'),'--noEmit'],root/'project',clean,min(validation_started+120,started+960),4096)
              runtime_guard();source_guard()
              phase='harness-typecheck';run_cmd('harness-typecheck',[node,str(root/'project/node_modules/typescript/bin/tsc'),'--noEmit','--project',str(root/'validation/tsconfig.json')],root/'validation',clean,min(validation_started+240,started+960),4096)
              runtime_guard();source_guard()
              upload('checkpoint.json',{'identity':identity,'phase':'TYPECHECKS_PASSED','dependency':inventory,'commands':[x for x in commands if x['label'] not in ('node-version','npm-version')],'scratch':disk_observation(),'runtimePinsRechecked':True,'sourcePinsRechecked':True,'syntheticSuite':'NOT_RUN'})
              checkpoint_done=True;phase='synthetic'
              raw=run_cmd('synthetic',[node,'--import','tsx','--test','wp004a.synthetic.test.ts'],root/'validation',clean,min(validation_started+480,started+960),16384)
              runtime_guard();source_guard();records=[]
              for line in raw.decode('utf-8',errors='strict').splitlines():
                  m=re.fullmatch(r'(?:# )?QV_CASE (.+)',line.strip())
                  if m:records.append(json.loads(m[1]))
              require([x['id'] for x in records]==doc['caseIds'],'CASE_ORDER_OR_MISSING')
              require(all(x['status']=='PASS' for x in records),'CASE_NOT_PASS')
              upload('final.json',{'identity':identity,'status':'LOGIC_PASS_PENDING_AGENT_READBACK','cases':records,'command':commands[-1],'sourcePinsRechecked':True,'runtimePinsRechecked':True,'WP004a':'NOT_ACCEPTED','R1':'UNSUPPORTED_IN_OBSERVED_E02_CONFIGURATION','cost':{'actualBillUSD':None,'quota':None,'elapsedSeconds':time.monotonic()-started},'durability':'UNPROVEN_UNTIL_READBACK'})
          except Exception as error:
              primary=exception_record(error)
              if any(name not in [x['name'] for x in files] for name in attempted_files):api_failed=True
              print('QV_STOP '+encode(primary).decode().strip(),flush=True)
              if not api_failed:
                  try:
                      if not any(x['name']=='boot.json' for x in files):
                          upload('boot.json',{'identity':identity,'status':'QUALIFICATION_STOP','runtime':runtime,'commands':commands[:2],'primary':primary})
                      if not checkpoint_done and not any(x['name']=='checkpoint.json' for x in files):
                          upload('checkpoint.json',{'identity':identity,'status':'STOP','primary':primary,'commands':[x for x in commands if x['label'] not in ('node-version','npm-version')],'remaining':'NOT_RUN'})
                      if not any(x['name']=='final.json' for x in files):
                          upload('final.json',{'identity':identity,'status':'STOP_NOT_ACCEPTED','primary':primary,'lastCommand':commands[-1] if commands else None,'caseResults':'Read QV_CASE records in retained command; missing IDs NOT_RUN, never PASS','WP004a':'NOT_ACCEPTED','cost':{'actualBillUSD':None,'elapsedSeconds':time.monotonic()-started}})
                  except Exception as recovery_error:
                      print('QV_RECOVERY_STOP '+encode(exception_record(recovery_error)).decode().strip(),flush=True)
              sys.exit(1)
          PY_QV
