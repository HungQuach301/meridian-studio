                    require(len(json.dumps(manifest,separators=(',',':')).encode())<=1048000,'RUNTIME_INVENTORY_CAP')\n                    if member.issym():links.append((path,member.linkname,link_target(path,member.linkname)));continue\n                    # Links are never created until every regular write is finished.\n                    target.parent.mkdir(parents=True,exist_ok=True)\n                    if member.isdir():target.mkdir(exist_ok=True,mode=0o700);continue\n                    require(member.size>=0 and total+member.size<=536870912,'EXTRACT_BYTES_CAP');total+=member.size\n                    stream=archive.extractfile(member);require(stream is not None,'TAR_FILE_MISSING');count=0\n                    with stream,open(target,'xb') as output:\n                        while True:\n                            tick();chunk=stream.read(65536)\n                            if not chunk:break\n                            count+=len(chunk);require(count<=member.size,'TAR_FILE_OVERFLOW');output.write(chunk)\n                    require(count==member.size,'TAR_FILE_TRUNCATED');target.chmod(0o700 if member.mode & 0o111 else 0o600)\n            # Drain bounded decompressed tail to verify XZ framing/CRC; never ignore it.\n            while reader.read(65536):tick()\n        for path,link,resolved in links:\n            tick();target=destination/str(path);resolved_path=destination/str(resolved)\n            require(not target.exists() and not target.is_symlink(),'TAR_LINK_COLLISION')\n            require(resolved_path.exists() and not resolved_path.is_symlink(),'TAR_LINK_CHAIN_UNSUPPORTED')\n            require(resolved_path.resolve().is_relative_to(destination.resolve()),'TAR_LINK_ESCAPE')\n            target.parent.mkdir(parents=True,exist_ok=True);target.symlink_to(link)\n    except Exception as failure:\n        error=type(failure).__name__+(':'+str(failure) if isinstance(failure,RuntimeError) else '')\n    finally:\n        dump(spec['receipt'],{'members':manifest,'expandedRegularBytes':total,'error':error,'complete':error is None})\n    require(error is None,'EXTRACTION_FAILED')\n\nif __name__=='__main__':\n    spec=json.loads(Path(sys.argv[1]).read_bytes())\n    if spec['operation']=='acquire':acquire(spec)\n    elif spec['operation']=='extract':extract(spec)\n    else:raise RuntimeError('WORKER_OPERATION')\n"
