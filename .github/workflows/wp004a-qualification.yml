name: WP004a qualification (separate execution approval)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged workflow commit approved for one attempt
        required: true
        type: string
      decision_sha256:
        description: Reviewed E-TOTAL-02 decision digest
        required: true
        type: string
      qualification_id:
        description: Approved one-use qualification identifier
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: wp004a-qualification-04
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'HungQuach301/meridian-studio' && github.actor == 'HungQuach301' && github.triggering_actor == 'HungQuach301' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: One qualification and synthetic validation attempt
        shell: bash
        env:
          QV_SOURCE_SHA: ${{ inputs.source_sha }}
          QV_DECISION_SHA256: ${{ inputs.decision_sha256 }}
          QV_NONCE: ${{ inputs.qualification_id }}
          QV_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=2s 1460s /usr/bin/python3 -I - <<'PY_QV'
          # E-TOTAL-02 draft. NOT RUN during offline preparation.
          import base64, hashlib, json, os, re, selectors, signal, subprocess, sys, time, traceback, zlib
          from pathlib import Path, PurePosixPath
