name: Hello

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: Approved operation
        required: true
        type: choice
        options: [heartbeat, send-hello]
        default: heartbeat
      expected_sha:
        description: Full main SHA approved for this execution
        required: true
        type: string
  repository_dispatch:
    types: [hello]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - &checkout
        name: Check out event source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &node
        name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - &source
        name: Record source and protected files
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '20') process.exit(1)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_SHA %s EVENT %s ATTEMPT %s\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ATTEMPT"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/wp002-source.sha256"
          git ls-files -z ':!:pipeline/state.json' | xargs -0 sha256sum > "$RUNNER_TEMP/wp002-nonstate.sha256"
      - &install
        name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - &worker
        name: Prepare shared TypeScript worker in runner temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/wp002"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/wp002/node_modules"
          cat > "$RUNNER_TEMP/wp002/heartbeat.ts" <<'TS'
          import ts from 'typescript';
          import { Ajv2020 } from 'ajv/dist/2020.js';
          import type { AnySchema } from 'ajv';
          import addFormats from 'ajv-formats';

          type RecordValue = Record<string, unknown>;
          function requireValue(condition: unknown, code: string): asserts condition {
            if (!condition) throw new Error(code);
          }
          function object(value: unknown, code: string): RecordValue {
            requireValue(value !== null && typeof value === 'object' && !Array.isArray(value), code);
            return value as RecordValue;
          }
          function readText(path: string, code: string): string {
            const text = ts.sys.readFile(path);
            requireValue(text !== undefined, code);
            return text;
          }
          function parse(text: string, code: string): unknown {
            try { return JSON.parse(text) as unknown; } catch { throw new Error(code); }
          }
          function read(path: string, code: string): unknown {
            return parse(readText(path, code), code);
          }
          function timestampSpan(text: string): { start: number; end: number } {
            // JSON.parse validates syntax before this AST locates the root timestamp.
            const source = ts.parseJsonText('pipeline-state.json', text);
            const statement = source.statements[0];
            requireValue(source.statements.length === 1 && statement !== undefined &&
              ts.isExpressionStatement(statement) && ts.isObjectLiteralExpression(statement.expression), 'WP002_TIMESTAMP_PROPERTY');
            const properties = statement.expression.properties.filter((property): property is ts.PropertyAssignment =>
              ts.isPropertyAssignment(property) && ts.isStringLiteral(property.name) && property.name.text === 'updatedAt');
            const property = properties[0];
            requireValue(properties.length === 1 && property !== undefined &&
              ts.isStringLiteral(property.initializer), 'WP002_TIMESTAMP_PROPERTY');
            return { start: property.initializer.getStart(source), end: property.initializer.end };
          }
          function admission(args: string[]): void {
            const [path, eventName, ref, sha, attempt, repository] = args;
            requireValue(path && /^[0-9a-f]{40}$/.test(sha ?? '') && sha !== '0'.repeat(40), 'WP002_ADMISSION_SHA');
            requireValue(repository === 'HungQuach301/meridian-studio', 'WP002_ADMISSION_REPOSITORY');
            requireValue(ref === 'refs/heads/main', 'WP002_ADMISSION_REF');
            requireValue(attempt === '1', 'WP002_ADMISSION_ATTEMPT');
            const event = object(read(path, 'WP002_ADMISSION_JSON'), 'WP002_ADMISSION_EVENT');
            const repo = object(event.repository, 'WP002_ADMISSION_REPOSITORY');
            requireValue(repo.full_name === repository && repo.default_branch === 'main', 'WP002_ADMISSION_REPOSITORY');
            let values: RecordValue;
            let mode: unknown;
            if (eventName === 'workflow_dispatch') {
              values = object(event.inputs, 'WP002_ADMISSION_INPUTS');
              mode = values.mode;
              requireValue(mode === 'heartbeat' || mode === 'send-hello', 'WP002_ADMISSION_MODE');
            } else {
              requireValue(eventName === 'repository_dispatch' && event.action === 'hello', 'WP002_ADMISSION_EVENT');
              values = object(event.client_payload, 'WP002_ADMISSION_PAYLOAD');
              if (Object.hasOwn(values, 'source')) {
                requireValue(values.source === 'cockpit', 'WP004_ADMISSION_SOURCE');
                requireValue(Object.keys(values).sort().join(',') === 'expected_sha,request_id,source', 'WP004_ADMISSION_PAYLOAD');
                requireValue(typeof values.request_id === 'string' && values.request_id.length === 36 &&
                  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(values.request_id), 'WP004_ADMISSION_REQUEST_ID');
                ts.sys.write('SOURCE_CLIENT cockpit CLIENT_REQUEST_ID ' + values.request_id + '\n');
              } else {
                requireValue(!Object.hasOwn(values, 'request_id'), 'WP004_ADMISSION_PAYLOAD');
                requireValue(typeof values.source_run_id === 'string' && /^[1-9][0-9]*$/.test(values.source_run_id), 'WP002_ADMISSION_BINDING');
                requireValue(values.source_run_attempt === '1', 'WP002_ADMISSION_BINDING');
                ts.sys.write('SOURCE_RUN_ID ' + values.source_run_id + ' SOURCE_RUN_ATTEMPT 1\n');
              }
              mode = 'heartbeat';
            }
            requireValue(values.expected_sha === sha, 'WP002_ADMISSION_SHA');
            ts.sys.write('PASS ADMISSION ' + eventName + ' ' + mode + ' ' + sha + '\n');
          }
          function stateCommand(command: string, args: string[]): void {
            const [schemaPath, beforePath, afterPath, timestamp] = args;
            requireValue(schemaPath && beforePath && afterPath, 'WP002_ARGUMENTS');
            const schema = object(read(schemaPath, 'WP002_SCHEMA_JSON'), 'WP002_SCHEMA_JSON');
            const ajv = new Ajv2020({ allErrors: true, strict: true });
            addFormats(ajv);
            const validate = ajv.compile(schema as AnySchema);
            const beforeText = readText(beforePath, 'WP002_STATE_JSON');
            const before = object(parse(beforeText, 'WP002_STATE_JSON'), 'WP002_STATE_SCHEMA');
            requireValue(validate(before), 'WP002_STATE_SCHEMA');
            const beforeSpan = timestampSpan(beforeText);
            requireValue(command !== 'prepare' || typeof timestamp === 'string', 'WP002_ARGUMENTS');
            // Splice only the timestamp token; never serialize parsed state numbers.
            const afterText = command === 'prepare'
              ? beforeText.slice(0, beforeSpan.start) + JSON.stringify(timestamp) + beforeText.slice(beforeSpan.end)
              : readText(afterPath, 'WP002_STATE_JSON');
            const after = object(parse(afterText, 'WP002_STATE_JSON'), 'WP002_STATE_SCHEMA');
            requireValue(validate(after), 'WP002_STATE_SCHEMA');
            requireValue(typeof after.updatedAt === 'string' && typeof before.updatedAt === 'string', 'WP002_TIMESTAMP');
            requireValue(Number.isFinite(Date.parse(after.updatedAt)) && Date.parse(after.updatedAt) > Date.parse(before.updatedAt), 'WP002_TIMESTAMP');
            const afterSpan = timestampSpan(afterText);
            requireValue(beforeText.slice(0, beforeSpan.start) === afterText.slice(0, afterSpan.start) &&
              beforeText.slice(beforeSpan.end) === afterText.slice(afterSpan.end), 'WP002_STATE_DELTA');
            if (command === 'prepare') ts.sys.writeFile(afterPath, afterText);
            ts.sys.write('PASS ' + command.toUpperCase() + ' updatedAt ' + before.updatedAt + ' -> ' + after.updatedAt + '\n');
          }
          try {
            const [command, ...args] = ts.sys.args;
            if (command === 'admit') admission(args);
            else {
              requireValue(command === 'prepare' || command === 'verify', 'WP002_ARGUMENTS');
              stateCommand(command, args);
            }
          } catch (error) {
            ts.sys.write('FAIL ' + (error instanceof Error ? error.message : 'WP002_UNEXPECTED') + '\n');
            ts.sys.exit(1);
          }
          TS
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/wp002/tsconfig.json', JSON.stringify({
            extends: process.env.GITHUB_WORKSPACE + '/tsconfig.json',
            files: ['./heartbeat.ts'], include: [],
          }));
          NODE
          node node_modules/typescript/bin/tsc -p "$RUNNER_TEMP/wp002/tsconfig.json"
      - name: Exercise shared worker with temporary fixtures
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync, existsSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.GITHUB_WORKSPACE;
          const dir = join(process.env.RUNNER_TEMP, 'wp002', 'fixtures');
          mkdirSync(dir);
          const cli = join(root, 'node_modules/tsx/dist/cli.mjs');
          const worker = join(process.env.RUNNER_TEMP, 'wp002/heartbeat.ts');
          const schema = join(root, 'engine/contracts/pipeline-state.schema.json');
          const original = readFileSync(join(root, 'pipeline/state.json'));
          let count = 0;
          const run = (name, args, status = 0, pattern = /PASS/) => {
            const result = spawnSync(process.execPath, [cli, worker, ...args], { encoding: 'utf8', timeout: 30000 });
            assert.ifError(result.error);
            const output = result.stdout + result.stderr;
            assert.equal(result.status, status, name + '\n' + output);
            assert.match(output, pattern);
            count += 1;
            console.log('PASS FIXTURE ' + name + ' expected exit ' + status + '\n' + output.trim());
          };
          const before = join(dir, 'before.json');
          const after = join(dir, 'after.json');
          const later = join(dir, 'later.json');
          const timestamp = '2026-09-09T00:00:00.000Z';
          const state = { updatedAt: '2026-01-01T00:00:00Z', monthlySpendUsd: 0, episodes: [
            { episodeId: 'fixture', stage: 'S01', status: 'idle', flags: ['retain'] },
          ], unknownField: { nested: [1, 'retain'] } };
          const input = JSON.stringify(state, null, 2) + '\n';
          writeFileSync(before, input);
          run('preserve-all-data', ['prepare', schema, before, after, timestamp]);
          const first = readFileSync(after, 'utf8');
          const expected = { ...state, updatedAt: timestamp };
          assert.deepEqual(JSON.parse(first), expected);
          assert.equal(readFileSync(before, 'utf8'), input);
          run('same-input-same-timestamp', ['prepare', schema, before, after, timestamp]);
          assert.equal(readFileSync(after, 'utf8'), first);
          run('second-heartbeat', ['prepare', schema, after, later, '2026-09-09T00:01:00.000Z']);
          assert.deepEqual(JSON.parse(readFileSync(later)), { ...expected, updatedAt: '2026-09-09T00:01:00.000Z' });
          run('verify-candidate', ['verify', schema, before, after]);
          const invalid = join(dir, 'invalid.json');
          for (const [name, value, time, code] of [
            ['missing-episodes', { updatedAt: state.updatedAt }, timestamp, 'WP002_STATE_SCHEMA'],
            ['broken-json', '{', timestamp, 'WP002_STATE_JSON'],
            ['invalid-input-time', { ...state, updatedAt: 'bad' }, timestamp, 'WP002_STATE_SCHEMA'],
            ['invalid-output-time', state, 'bad', 'WP002_STATE_SCHEMA'],
            ['unchanged-time', state, state.updatedAt, 'WP002_TIMESTAMP'],
            ['backward-time', state, '2025-01-01T00:00:00Z', 'WP002_TIMESTAMP'],
          ]) {
            const outputPath = join(dir, name + '.json');
            writeFileSync(invalid, typeof value === 'string' ? value : JSON.stringify(value));
            run(name, ['prepare', schema, invalid, outputPath, time], 1, new RegExp(code));
            assert.equal(existsSync(outputPath), false);
          }
          writeFileSync(invalid, JSON.stringify({ ...expected, monthlySpendUsd: 10 }));
          run('reject-other-field-change', ['verify', schema, before, invalid], 1, /WP002_STATE_DELTA/);
          writeFileSync(invalid, JSON.stringify({ updatedAt: timestamp }));
          run('reject-invalid-candidate', ['verify', schema, before, invalid], 1, /WP002_STATE_SCHEMA/);
          // Raw JSON is essential: JavaScript number literals would round before the worker sees them.
          const rawInput = String.raw`{
            "unknownField": {
              "updatedAt": "2026-01-01T00:00:00Z",
              "externalId": 9007199254740993,
              "decimal": 0.12345678901234567890123456789,
              "huge": 1e400,
              "tiny": 1e-400,
              "negativeZero": -0,
              "text": "literal \"updatedAt\": [1, {\"n\": 2}] \\ \u0030 😀"
            },
            "\u0075pdatedAt"   : "2026-01-01T00:00:00Z",
            "monthlySpendUsd": 0.12345678901234567890123456789,
            "episodes": []
          }
          `.replace(/\n/g, '\r\n');
          const rawExpected = rawInput.replace(
            String.raw`"\u0075pdatedAt"   : "2026-01-01T00:00:00Z"`,
            String.raw`"\u0075pdatedAt"   : "2026-09-09T00:00:00.000Z"`);
          const rawBefore = join(dir, 'raw-before.json');
          const rawAfter = join(dir, 'raw-after.json');
          writeFileSync(rawBefore, rawInput);
          run('raw-number-preservation', ['prepare', schema, rawBefore, rawAfter, timestamp]);
          assert.deepEqual(readFileSync(rawAfter), Buffer.from(rawExpected));
          assert.deepEqual(readFileSync(rawBefore), Buffer.from(rawInput));
          run('raw-candidate-verifies', ['verify', schema, rawBefore, rawAfter]);
          for (const [name, candidate] of [
            ['rounded-integer-refused', rawExpected.replace('9007199254740993', '9007199254740992')],
            ['rounded-decimal-refused', rawExpected.replaceAll('0.12345678901234567890123456789', '0.12345678901234568')],
          ]) {
            assert.deepEqual(JSON.parse(candidate), JSON.parse(rawExpected));
            writeFileSync(invalid, candidate);
            run(name, ['verify', schema, rawBefore, invalid], 1, /WP002_STATE_DELTA/);
          }
          writeFileSync(invalid, String.raw`{"updatedAt":"2026-01-01T00:00:00Z","\u0075pdatedAt":"2026-01-01T00:00:00Z","episodes":[]}`);
          const ambiguousOutput = join(dir, 'ambiguous-output.json');
          run('ambiguous-root-timestamp-refused', ['prepare', schema, invalid, ambiguousOutput, timestamp], 1, /WP002_TIMESTAMP_PROPERTY/);
          assert.equal(existsSync(ambiguousOutput), false);
          const sha = 'a'.repeat(40);
          const repository = { full_name: 'HungQuach301/meridian-studio', default_branch: 'main' };
          const manual = { repository, inputs: { mode: 'heartbeat', expected_sha: sha } };
          const receipt = { repository, action: 'hello', client_payload: {
            expected_sha: sha, source_run_id: '123', source_run_attempt: '1',
          } };
          const eventPath = join(dir, 'event.json');
          const admit = (name, event, kind = 'workflow_dispatch', ref = 'refs/heads/main', source = sha, attempt = '1', repo = repository.full_name, code) => {
            writeFileSync(eventPath, typeof event === 'string' ? event : JSON.stringify(event));
            run(name, ['admit', eventPath, kind, ref, source, attempt, repo], code ? 1 : 0, code ? new RegExp(code) : /PASS ADMISSION/);
          };
          admit('manual-heartbeat', manual);
          admit('manual-sender', { ...manual, inputs: { ...manual.inputs, mode: 'send-hello' } });
          admit('received-hello', receipt, 'repository_dispatch');
          admit('wrong-ref', manual, undefined, 'refs/heads/other', undefined, undefined, undefined, 'WP002_ADMISSION_REF');
          admit('wrong-sha', manual, undefined, undefined, 'b'.repeat(40), undefined, undefined, 'WP002_ADMISSION_SHA');
          admit('rerun-refused', manual, undefined, undefined, undefined, '2', undefined, 'WP002_ADMISSION_ATTEMPT');
          admit('wrong-repo', manual, undefined, undefined, undefined, undefined, 'other/repo', 'WP002_ADMISSION_REPOSITORY');
          admit('wrong-mode', { ...manual, inputs: { ...manual.inputs, mode: 'bad' } }, undefined, undefined, undefined, undefined, undefined, 'WP002_ADMISSION_MODE');
          admit('push-refused', manual, 'push', undefined, undefined, undefined, undefined, 'WP002_ADMISSION_EVENT');
          admit('wrong-dispatch-type', { ...receipt, action: 'other' }, 'repository_dispatch', undefined, undefined, undefined, undefined, 'WP002_ADMISSION_EVENT');
          admit('missing-input-sha', { ...manual, inputs: { mode: 'heartbeat' } }, undefined, undefined, undefined, undefined, undefined, 'WP002_ADMISSION_SHA');
          admit('missing-binding', { ...receipt, client_payload: { expected_sha: sha } }, 'repository_dispatch', undefined, undefined, undefined, undefined, 'WP002_ADMISSION_BINDING');
          admit('malformed-payload', '{', undefined, undefined, undefined, undefined, undefined, 'WP002_ADMISSION_JSON');
          assert.equal(count, 30);
          assert.deepEqual(readFileSync(join(root, 'pipeline/state.json')), original);
          console.log('PASS WP002_FIXTURES ' + count + '; repository state unchanged; no dispatch');
          const cockpit = { repository, action: 'hello', client_payload: {
            expected_sha: sha, source: 'cockpit', request_id: '8c851e08-fba0-4c55-a782-922279645d45',
          } };
          const cockpitCase = (name, change = {}, code) => admit('cockpit-' + name,
            { ...cockpit, client_payload: { ...cockpit.client_payload, ...change } },
            'repository_dispatch', undefined, undefined, undefined, undefined, code);
          cockpitCase('accepted');
          for (const [name, change, code] of [
            ['wrong-source', { source: 'other' }, 'WP004_ADMISSION_SOURCE'],
            ['null-source', { source: null }, 'WP004_ADMISSION_SOURCE'],
            ['missing-id', { request_id: undefined }, 'WP004_ADMISSION_PAYLOAD'],
            ['numeric-id', { request_id: 123 }, 'WP004_ADMISSION_REQUEST_ID'],
            ['blank-id', { request_id: '' }, 'WP004_ADMISSION_REQUEST_ID'],
            ['wrong-version', { request_id: '8c851e08-fba0-1c55-a782-922279645d45' }, 'WP004_ADMISSION_REQUEST_ID'],
            ['wrong-variant', { request_id: '8c851e08-fba0-4c55-1782-922279645d45' }, 'WP004_ADMISSION_REQUEST_ID'],
            ['uppercase-id', { request_id: cockpit.client_payload.request_id.toUpperCase() }, 'WP004_ADMISSION_REQUEST_ID'],
            ['newline-id', { request_id: cockpit.client_payload.request_id + '\n' }, 'WP004_ADMISSION_REQUEST_ID'],
            ['mixed-run-id', { source_run_id: '123' }, 'WP004_ADMISSION_PAYLOAD'],
            ['mixed-attempt', { source_run_attempt: '1' }, 'WP004_ADMISSION_PAYLOAD'],
            ['extra-path', { path: 'pipeline/state.json' }, 'WP004_ADMISSION_PAYLOAD'],
            ['missing-sha', { expected_sha: undefined }, 'WP004_ADMISSION_PAYLOAD'],
            ['wrong-sha', { expected_sha: 'b'.repeat(40) }, 'WP002_ADMISSION_SHA'],
          ]) cockpitCase(name, change, code);
          admit('cockpit-missing-source', { ...cockpit, client_payload: {
            expected_sha: sha, request_id: cockpit.client_payload.request_id,
          } }, 'repository_dispatch', undefined, undefined, undefined, undefined, 'WP004_ADMISSION_PAYLOAD');
          admit('cockpit-mixed-legacy', { ...receipt, client_payload: {
            ...receipt.client_payload, request_id: cockpit.client_payload.request_id,
          } }, 'repository_dispatch', undefined, undefined, undefined, undefined, 'WP004_ADMISSION_PAYLOAD');
          admit('cockpit-wrong-ref', cockpit, 'repository_dispatch', 'refs/heads/other', undefined, undefined, undefined, 'WP002_ADMISSION_REF');
          admit('cockpit-rerun', cockpit, 'repository_dispatch', undefined, undefined, '2', undefined, 'WP002_ADMISSION_ATTEMPT');
          admit('cockpit-wrong-repo', cockpit, 'repository_dispatch', undefined, undefined, undefined, 'other/repo', 'WP002_ADMISSION_REPOSITORY');
          admit('cockpit-wrong-event', cockpit, 'push', undefined, undefined, undefined, undefined, 'WP002_ADMISSION_EVENT');
          admit('cockpit-wrong-action', { ...cockpit, action: 'other' }, 'repository_dispatch', undefined, undefined, undefined, undefined, 'WP002_ADMISSION_EVENT');
          admit('cockpit-array-payload', { ...cockpit, client_payload: [] }, 'repository_dispatch', undefined, undefined, undefined, undefined, 'WP002_ADMISSION_PAYLOAD');
          assert.equal(count, 53, 'Both admission branches must exercise every case');
          assert.deepEqual(readFileSync(join(root, 'pipeline/state.json')), original);
          rmSync(dir, { recursive: true });
          console.log('PASS WP004_ADMISSION_FIXTURES ' + (count - 30) + '; repository state unchanged; no dispatch');
          NODE
      - name: Run existing source checks
        run: |
          npm run test
          npm run validate
          npm run typecheck
      - &admission
        name: Validate requested execution before any write or dispatch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          node node_modules/tsx/dist/cli.mjs "$RUNNER_TEMP/wp002/heartbeat.ts" admit \
            "$GITHUB_EVENT_PATH" "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY"
      - name: Verify all source files remain unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum --check "$RUNNER_TEMP/wp002-source.sha256"
          echo 'PASS all source files unchanged'

  heartbeat:
    needs: verify
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'heartbeat')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: wp002-heartbeat-main
      cancel-in-progress: false
    steps:
      - *checkout
      - *node
      - *source
      - *install
      - *worker
      - *admission
      - name: Validate state before preparing heartbeat
        run: npm run validate
      - name: Validate candidate without changing repository state
        run: |
          cp pipeline/state.json "$RUNNER_TEMP/wp002/state.before.json"
          timestamp="$(node -e 'process.stdout.write(new Date().toISOString())')"
          node node_modules/tsx/dist/cli.mjs "$RUNNER_TEMP/wp002/heartbeat.ts" prepare \
            engine/contracts/pipeline-state.schema.json pipeline/state.json \
            "$RUNNER_TEMP/wp002/state.after.json" "$timestamp"
          sha256sum --check "$RUNNER_TEMP/wp002-source.sha256"
      - name: Commit one heartbeat and verify remote result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/wp002/askpass.sh" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/wp002/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/wp002/askpass.sh" GIT_TERMINAL_PROMPT=0
          check_main() {
            remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            if test "$remote_sha" != "$GITHUB_SHA"; then
              echo 'FAIL WP002_MAIN_MOVED'; exit 1
            fi
          }
          check_main
          node node_modules/tsx/dist/cli.mjs "$RUNNER_TEMP/wp002/heartbeat.ts" verify \
            engine/contracts/pipeline-state.schema.json pipeline/state.json "$RUNNER_TEMP/wp002/state.after.json"
          cp "$RUNNER_TEMP/wp002/state.after.json" pipeline/state.json
          npm run validate
          sha256sum --check "$RUNNER_TEMP/wp002-nonstate.sha256"
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git diff --name-only)" = 'pipeline/state.json'
          git diff --cached --exit-code
          git add -- pipeline/state.json
          test "$(git diff --cached --name-only)" = 'pipeline/state.json'
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git -c core.hooksPath=/dev/null commit -m 'chore: heartbeat'
          heartbeat_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'pipeline/state.json'
          test "$(git log -1 --format=%s)" = 'chore: heartbeat'
          check_main
          git push origin HEAD:refs/heads/main
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$heartbeat_sha"
          git show FETCH_HEAD:pipeline/state.json > "$RUNNER_TEMP/wp002/state.remote.json"
          cmp pipeline/state.json "$RUNNER_TEMP/wp002/state.remote.json"
          node node_modules/tsx/dist/cli.mjs "$RUNNER_TEMP/wp002/heartbeat.ts" verify \
            engine/contracts/pipeline-state.schema.json "$RUNNER_TEMP/wp002/state.before.json" "$RUNNER_TEMP/wp002/state.remote.json"
          git diff --exit-code
          git diff --cached --exit-code
          sha256sum --check "$RUNNER_TEMP/wp002-nonstate.sha256"
          printf 'HEARTBEAT_COMMIT %s\n' "$heartbeat_sha"
          printf 'Source: `%s`\n\n[Heartbeat commit](https://github.com/%s/commit/%s)\n\nNo push CI is expected for GITHUB_TOKEN.\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$heartbeat_sha" >> "$GITHUB_STEP_SUMMARY"

  send-hello:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'send-hello'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - *checkout
      - *node
      - *source
      - *install
      - *worker
      - *admission
      - name: Send one hello event without modifying state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/git/ref/heads/main', {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
            redirect: 'error', signal: AbortSignal.timeout(30000),
          });
          assert.equal(response.status, 200, 'WP002_MAIN_READ');
          const ref = await response.json();
          assert.equal(ref.object?.sha, process.env.GITHUB_SHA, 'WP002_MAIN_MOVED');
          const result = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/dispatches', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN,
              Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_type: 'hello', client_payload: {
              expected_sha: process.env.GITHUB_SHA,
              source_run_id: process.env.GITHUB_RUN_ID,
              source_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            } }),
          });
          assert.equal(result.status, 204, 'WP002_DISPATCH_HTTP');
          console.log('PASS DISPATCH_HTTP 204 SOURCE_RUN_ID ' + process.env.GITHUB_RUN_ID + ' EXPECTED_SHA ' + process.env.GITHUB_SHA);
          NODE
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum --check "$RUNNER_TEMP/wp002-source.sha256"
          printf 'Sent one repository_dispatch hello from run `%s` at `%s`.\n\nVerify the receiving run separately; HTTP 204 is not heartbeat acceptance.\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
